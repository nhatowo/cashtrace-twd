name: Build iOS IPA (Unsigned & Certificate Signed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build CashTrace iOS IPA on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js Static Export (out/)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Initialize & Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Configure iOS Camera & Photo Permissions in Info.plist
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'CashTrace cần quyền truy cập Camera để quét số seri tờ tiền Đài Loan (TWD).'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'CashTrace cần quyền truy cập Camera để quét số seri tờ tiền Đài Loan (TWD).'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'CashTrace cần quyền truy cập Thư viện ảnh để chọn ảnh tờ tiền quét số seri.'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'CashTrace cần quyền truy cập Thư viện ảnh để chọn ảnh tờ tiền quét số seri.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'CashTrace cần quyền lưu ảnh.'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'CashTrace cần quyền lưu ảnh.'" "$PLIST"

      - name: Build Unsigned iOS App via Xcode
        run: |
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package Unsigned .ipa
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r CashTrace-Unsigned.ipa Payload
          rm -rf Payload

      - name: Sign .ipa with Certificate (.p12 + .mobileprovision) if Secrets are provided
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$PROVISION_BASE64" ]; then
            echo "Found certificate secrets, signing IPA with zsign..."
            brew install zsign
            echo "$P12_BASE64" | base64 --decode > cert.p12
            echo "$PROVISION_BASE64" | base64 --decode > cert.mobileprovision
            zsign -k cert.p12 -p "$P12_PASSWORD" -m cert.mobileprovision -o CashTrace-Signed.ipa CashTrace-Unsigned.ipa
            rm -f cert.p12 cert.mobileprovision
          else
            echo "No certificate secrets provided; skipping automatic zsign step."
          fi

      - name: Upload Unsigned .ipa Artifact (For ESign / Feather / Scarlet / Sideloadly)
        uses: actions/upload-artifact@v4
        with:
          name: CashTrace-Unsigned-IPA
          path: CashTrace-Unsigned.ipa
          retention-days: 30

      - name: Upload Signed .ipa Artifact (If signed via GitHub Secrets)
        uses: actions/upload-artifact@v4
        with:
          name: CashTrace-Signed-IPA
          path: CashTrace-Signed.ipa
          if-no-files-found: ignore
          retention-days: 30
